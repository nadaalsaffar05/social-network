<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Auth Backend Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        input,
        textarea,
        button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            cursor: pointer;
        }

        #output {
            background: #111;
            color: #00ff88;
            padding: 15px;
            min-height: 100px;
            white-space: pre-wrap;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<h1>Go Authentication Test</h1>

<p>
    This page is only for testing the Go authentication backend.
</p>


<!-- ========================================== -->
<!-- REGISTER -->
<!-- ========================================== -->

<div class="box">

    <h2>1. Register</h2>

    <input
        id="registerEmail"
        type="email"
        placeholder="Email"
        value="test@test.com"
    >

    <input
        id="registerPassword"
        type="password"
        placeholder="Password"
        value="123456"
    >

    <input
        id="firstName"
        type="text"
        placeholder="First Name"
        value="Test"
    >

    <input
        id="lastName"
        type="text"
        placeholder="Last Name"
        value="User"
    >

    <input
        id="dateOfBirth"
        type="date"
        value="2000-01-01"
    >

    <input
        id="nickname"
        type="text"
        placeholder="Nickname"
        value="tester"
    >

    <textarea
        id="aboutMe"
        placeholder="About Me"
    >Testing my authentication system</textarea>

    <button onclick="register()">
        Register
    </button>

</div>


<!-- ========================================== -->
<!-- LOGIN -->
<!-- ========================================== -->

<div class="box">

    <h2>2. Login</h2>

    <input
        id="loginEmail"
        type="email"
        placeholder="Email"
        value="test@test.com"
    >

    <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        value="123456"
    >

    <button onclick="login()">
        Login
    </button>

</div>


<!-- ========================================== -->
<!-- SESSION TEST -->
<!-- ========================================== -->

<div class="box">

    <h2>3. Session / Current User</h2>

    <button onclick="getMe()">
        Who am I? (/api/me)
    </button>

    <p>
        If this returns your user information,
        your cookie and session middleware are working.
    </p>

</div>


<!-- ========================================== -->
<!-- LOGOUT -->
<!-- ========================================== -->

<div class="box">

    <h2>4. Logout</h2>

    <button onclick="logout()">
        Logout
    </button>

</div>


<!-- ========================================== -->
<!-- OUTPUT -->
<!-- ========================================== -->

<div class="box">

    <h2>Backend Response</h2>

    <pre id="output">
Waiting for request...
    </pre>

</div>


<script>

    const output = document.getElementById("output");


    // ==========================================
    // DISPLAY BACKEND RESPONSE
    // ==========================================

    function showResult(title, status, data) {

        output.textContent =
            title +
            "\n\nHTTP Status: " +
            status +
            "\n\n" +
            JSON.stringify(data, null, 2);
    }


    // ==========================================
    // REGISTER
    // ==========================================

    async function register() {

        try {

            const data = {

                email:
                    document.getElementById(
                        "registerEmail"
                    ).value,

                password:
                    document.getElementById(
                        "registerPassword"
                    ).value,

                first_name:
                    document.getElementById(
                        "firstName"
                    ).value,

                last_name:
                    document.getElementById(
                        "lastName"
                    ).value,

                date_of_birth:
                    document.getElementById(
                        "dateOfBirth"
                    ).value,

                nickname:
                    document.getElementById(
                        "nickname"
                    ).value || null,

                about_me:
                    document.getElementById(
                        "aboutMe"
                    ).value || null
            };


            const response = await fetch(
                "/api/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify(data)
                }
            );


            const result =
                await response.json();


            showResult(
                "REGISTER",
                response.status,
                result
            );

        } catch (error) {

            output.textContent =
                "REGISTER ERROR\n\n" +
                error;
        }
    }


    // ==========================================
    // LOGIN
    // ==========================================

    async function login() {

        try {

            const data = {

                email:
                    document.getElementById(
                        "loginEmail"
                    ).value,

                password:
                    document.getElementById(
                        "loginPassword"
                    ).value
            };


            const response = await fetch(
                "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify(data)
                }
            );


            const result =
                await response.json();


            showResult(
                "LOGIN",
                response.status,
                result
            );

        } catch (error) {

            output.textContent =
                "LOGIN ERROR\n\n" +
                error;
        }
    }


    // ==========================================
    // CURRENT USER
    // ==========================================

    async function getMe() {

        try {

            const response = await fetch(
                "/api/me",
                {
                    method: "GET",

                    credentials: "include"
                }
            );


            const result =
                await response.json();


            showResult(
                "CURRENT USER (/api/me)",
                response.status,
                result
            );

        } catch (error) {

            output.textContent =
                "GET ME ERROR\n\n" +
                error;
        }
    }


    // ==========================================
    // LOGOUT
    // ==========================================

    async function logout() {

        try {

            const response = await fetch(
                "/api/logout",
                {
                    method: "POST",

                    credentials: "include"
                }
            );


            const result =
                await response.json();


            showResult(
                "LOGOUT",
                response.status,
                result
            );

        } catch (error) {

            output.textContent =
                "LOGOUT ERROR\n\n" +
                error;
        }
    }

</script>

</body>
</html>
