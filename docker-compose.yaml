services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: social-network-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/internal/db/social-network.db
      - MIGRATIONS_PATH=file:///app/internal/db/migrations/sqlite
    volumes:
      - backend_db:/app/internal/db
      - backend_uploads:/app/uploads
      - backend_tmp:/app/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/api/logout || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: social-network-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_db:
    driver: local
  backend_uploads:
    driver: local
  backend_tmp:
    driver: local
